# Whole-infra bring-up for TraceClean.
#
#   docker compose up --build -d            # core HTTP service only
#   docker compose --profile harness up --build -d   # + markllm / markdiffusion harnesses
#   docker compose --profile heavy up --build -d     # + ctrlregen / synthid (local builds)
#
# The skill and any web app talk to the tc-core service at http://127.0.0.1:8765
# (loopback-only host mapping). The heavy/harness images are one-shot CLIs:
# `up` starts them with `--help` to confirm the image, and real jobs run via
# `docker compose run`, e.g.:
#   docker compose run --rm tc-ctrlregen /data/shot.png -o /data/out.png
#
# ctrlregen and synthid bake in upstream code that is not publicly
# redistributable (all-rights-reserved / non-commercial Research License), so
# they build from source locally and are never pushed to GHCR.

name: traceclean

services:
  tc-core:
    build:
      context: service
      dockerfile: Dockerfile
    image: ghcr.io/mugenkyou/traceclean:latest
    ports:
      - "127.0.0.1:8765:8765"
    environment:
      # Empty by default (no auth). Set to require `Authorization: Bearer <key>`.
      TRACECLEAN_SERVER_API_KEY: ${TRACECLEAN_SERVER_API_KEY:-}
    read_only: true
    tmpfs:
      - /tmp
    init: true
    user: "10001:10001"
    restart: unless-stopped

  tc-markllm:
    profiles: [harness]
    build:
      context: service
      dockerfile: Dockerfile.markllm
    image: ghcr.io/mugenkyou/traceclean:markllm-latest
    # One-shot CLI: `up` just confirms the image; run real jobs with
    # `docker compose run --rm tc-markllm detect /data/wm.txt --scheme kgw`.
    command: ["--help"]
    read_only: true
    tmpfs:
      - /tmp
    init: true
    user: "10001:10001"
    environment:
      HF_TOKEN: ${HF_TOKEN:-}
      HF_HOME: /home/markllm/.cache/huggingface
    volumes:
      - traceclean-markllm-cache:/home/markllm/.cache/huggingface

  tc-markdiffusion:
    profiles: [harness]
    build:
      context: service
      dockerfile: Dockerfile.markdiffusion
    image: ghcr.io/mugenkyou/traceclean:markdiffusion-latest
    command: ["--help"]
    read_only: true
    tmpfs:
      - /tmp
    init: true
    user: "10001:10001"
    environment:
      HF_TOKEN: ${HF_TOKEN:-}
      HF_HOME: /home/markdiffusion/.cache/huggingface
    volumes:
      - traceclean-markdiffusion-cache:/home/markdiffusion/.cache/huggingface

  tc-ctrlregen:
    profiles: [heavy]
    build:
      context: service
      dockerfile: Dockerfile.ctrlregen
    # Local-only tag: upstream `noai-watermark` ships no LICENSE (all-rights-
    # reserved), so this image is never published.
    image: traceclean-ctrlregen:local
    command: ["--help"]
    read_only: true
    tmpfs:
      - /tmp
    init: true
    user: "10001:10001"
    environment:
      HF_TOKEN: ${HF_TOKEN:-}
      CTRLREGEN_DIR: /opt/noai-watermark
      NOAI_WATERMARK_DIR: /opt/noai-watermark
    volumes:
      - traceclean-ctrlregen-cache:/home/remover/.cache/huggingface

  tc-synthid:
    profiles: [heavy]
    build:
      context: service
      dockerfile: Dockerfile.synthid
    # Local-only tag: upstream `reverse-SynthID` is under a non-commercial
    # Research License, so this image is never published.
    image: traceclean-synthid-scorer:local
    command: ["--help"]
    read_only: true
    tmpfs:
      - /tmp
    init: true
    user: "10001:10001"
    volumes:
      - traceclean-synthid-cache:/home/scorer/.cache/huggingface

volumes:
  traceclean-markllm-cache:
  traceclean-markdiffusion-cache:
  traceclean-ctrlregen-cache:
  traceclean-synthid-cache:
